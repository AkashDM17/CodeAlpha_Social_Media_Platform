<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="View user profile, bios, posts and follower network on ConnectHub.">
  <title>User Profile | ConnectHub</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22%3E<text y=%2226%22 font-size=%2224%22>⚡</text></svg>">
</head>
<body>
  <div id="navbarContainer"></div>

  <main class="main-container single-column" style="max-width: 800px;">
    <!-- Profile Header Section -->
    <div id="profileHeaderContainer">
      <div class="spinner"></div>
    </div>

    <!-- Posts Header Section -->
    <div style="margin-top: 24px;">
      <div class="feed-tabs-header" style="margin-bottom: 20px;">
        <div class="feed-tab active" style="text-align: left; padding-left: 20px;">
          <span>📝</span> User Posts
        </div>
      </div>

      <!-- User Posts Stream -->
      <div id="userPostsContainer" style="display: flex; flex-direction: column; gap: 20px;">
        <div class="spinner"></div>
      </div>
    </div>
  </main>

  <!-- Edit Profile Modal -->
  <div class="modal-backdrop" id="editProfileModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3>Edit Profile</h3>
        <button class="modal-close-btn" onclick="closeEditProfileModal()">&times;</button>
      </div>
      <form id="editProfileForm">
        <div class="modal-body" style="display: flex; flex-direction: column; gap: 14px;">
          <div class="form-group">
            <label class="form-label" for="editName">Full Name</label>
            <input type="text" id="editName" class="form-control" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="editUsername">Username</label>
            <input type="text" id="editUsername" class="form-control" pattern="^[a-zA-Z0-9_]{3,30}$" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="editBio">Bio</label>
            <textarea id="editBio" class="form-control" rows="3" maxlength="200" placeholder="Tell the world a little about yourself..."></textarea>
          </div>

          <div class="form-group">
            <label class="form-label" for="editProfileImage">Profile Image URL</label>
            <input type="url" id="editProfileImage" class="form-control" placeholder="https://images.unsplash.com/...">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-secondary" onclick="closeEditProfileModal()">Cancel</button>
          <button type="submit" id="editProfileSubmitBtn" class="btn-primary" style="width: auto; padding: 10px 22px;">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Edit Post Modal -->
  <div class="modal-backdrop" id="editPostModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3>Edit Post</h3>
        <button class="modal-close-btn" onclick="closeEditPostModal()">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group" style="margin-bottom: 14px;">
          <label class="form-label">Post Content</label>
          <textarea id="editPostContent" class="form-control" rows="4" maxlength="2000" required></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">Image URL (Optional)</label>
          <input type="url" id="editPostImage" class="form-control">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" onclick="closeEditPostModal()">Cancel</button>
        <button class="btn-primary" style="width: auto; padding: 10px 20px;" onclick="submitEditPost()">Save Changes</button>
      </div>
    </div>
  </div>

  <!-- Delete Post Confirmation Modal -->
  <div class="modal-backdrop" id="deletePostModal">
    <div class="modal-box" style="max-width: 420px;">
      <div class="modal-header">
        <h3 style="color: var(--danger);">Delete Post</h3>
        <button class="modal-close-btn" onclick="closeDeletePostModal()">&times;</button>
      </div>
      <div class="modal-body">
        <p style="color: var(--text-muted); font-size: 0.95rem;">
          Are you sure you want to delete this post? All associated comments and likes will be permanently removed.
        </p>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" onclick="closeDeletePostModal()">Cancel</button>
        <button class="btn-primary" style="background: var(--danger); width: auto; padding: 10px 20px;" onclick="confirmDeletePost()">Yes, Delete</button>
      </div>
    </div>
  </div>

  <script src="js/main.js"></script>
  <script src="js/feed.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
