<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Log in to ConnectHub - Connect with peers and share updates.">
  <title>Log In | ConnectHub</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22%3E<text y=%2226%22 font-size=%2224%22>⚡</text></svg>">
</head>
<body>
  <div id="navbarContainer"></div>

  <div class="auth-page-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h1>Welcome Back</h1>
        <p>Log in to your ConnectHub account to access your feed</p>
      </div>

      <form id="loginForm" class="auth-form">
        <div class="form-group">
          <label class="form-label" for="identifier">Email or Username</label>
          <input type="text" id="identifier" class="form-control" placeholder="Enter your email or username" required autofocus autocomplete="username">
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <button type="submit" id="loginSubmitBtn" class="btn-primary" style="margin-top: 10px;">
          Log In
        </button>
      </form>

      <div class="demo-account-box">
        <div class="demo-title">
          <span>⚡ Demo Account Ready</span>
          <button type="button" class="btn-demo-autofill" onclick="fillDemoCredentials()">Auto-Fill</button>
        </div>
        <div>Email: <strong>demo@connecthub.com</strong></div>
        <div>Password: <strong>Demo123</strong></div>
      </div>

      <div class="auth-footer">
        Don't have an account yet? <a href="register.html">Sign Up</a>
      </div>
    </div>
  </div>

  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
