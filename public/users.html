<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Discover creators, developers, and designers on ConnectHub.">
  <title>Discover People | ConnectHub</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22%3E<text y=%2226%22 font-size=%2224%22>⚡</text></svg>">
</head>
<body>
  <div id="navbarContainer"></div>

  <main class="main-container single-column" style="max-width: 960px;">
    <!-- Search Bar Section -->
    <div class="widget-card" style="padding: 24px;">
      <h1 style="font-size: 1.6rem; font-weight: 800; margin-bottom: 8px;">Explore &amp; Discover Creators</h1>
      <p style="color: var(--text-muted); font-size: 0.92rem; margin-bottom: 20px;">
        Search members across the platform by their full name or unique username handle.
      </p>

      <div class="search-input-wrapper" style="max-width: 100%;">
        <span class="search-icon" style="font-size: 1.1rem; left: 18px;">🔍</span>
        <input type="text" id="userSearchInput" placeholder="Type a name or @username..." style="padding: 14px 20px 14px 50px; font-size: 1rem;">
      </div>
    </div>

    <!-- Users Grid Section -->
    <div style="margin-top: 10px;">
      <div id="usersGridContainer" class="users-grid">
        <div class="spinner"></div>
      </div>
    </div>
  </main>

  <script src="js/main.js"></script>
  <script src="js/users.js"></script>
</body>
</html>
